[package]
name = "ch32v203-app"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.1", features = ["esp32c6", "unstable"] }
esp-rtos = { version = "0.3", features = ["esp32c6", "embassy"] }
esp-backtrace= { version = "0.20", features = ["esp32c6", "panic-handler", "defmt"]}
esp-println= { version = "0.18.0", features = ["esp32c6", "defmt-espflash"]}
embassy-executor = { version = "0.10" }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }

defmt = "0.3"
#defmt-rtt = "0.4"
#rtt-target = {version = "0.6"}
#panic-halt = "0.2"
#panic-probe = { version = "0.3", features = ["print-defmt"]}


[profile.release]
lto = true
opt-level = "z"
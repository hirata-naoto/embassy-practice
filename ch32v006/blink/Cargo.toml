[package]
name = "ch32v006-app"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-hal = "1.0.0"
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", features = [
    "ch32v006f8u6",
    "rt",
    "embassy",
    "memory-x",
    "time-driver-tim2",
], default-features = false }
embassy-executor = { version = "0.10", features = ["executor-thread", "platform-spin"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
qingke-rt = "0.7.0"
panic-halt = "0.2"

[profile.release]
lto = true
opt-level = "z"
